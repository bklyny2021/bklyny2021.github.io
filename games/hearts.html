<div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
  <div id="modal-box" class="bg-emerald-900 rounded-2xl border-2 border-emerald-400 p-6 max-w-sm w-full text-center shadow-2xl"></div>
</div>

<script>
/* =========================================================
   Lo-Lifes Hearts
   Free-for-all (4 players). Standard 52-card deck, no jokers.
   Scoring: each ♥=1, 10♦=10, Q♠=13 (36/round).
   Passing: 3 cards, rotating left→right→across→hold.
   2♣ leads first book. Follow suit. No penalty on the first book.
   Hearts must be broken before leading. Game to 100, lowest wins.
   Moon = capture all scoring cards at round start -> instant win.
========================================================= */
const $=id=>document.getElementById(id);
const SUITS=['C','D','H','S'];
const SUIT_SYM={C:'♣',D:'♦',H:'♥',S:'♠'};
const RED={C:false,D:true,H:true,S:false};
const SEAT_NAMES=['You','East','North','West'];
const OPP=[1,2,3];
const rk=r=>(r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r));

function cardPenalty(c){ if(c.suit==='H')return 1; if(c.suit==='D'&&c.rank===10)return 10; if(c.suit==='S'&&c.rank===12)return 13; return 0; }
function isPenalty(c){ return cardPenalty(c)>0; }
function key(c){ return c.suit+c.rank; }

const S={
  round:0, scores:[0,0,0,0],
  phase:'idle',            // 'pass' | 'play' | 'over'
  hands:[[],[],[],[]],
  roundPts:[0,0,0,0],      // cards captured this round (penalty sums)
  captured:[[],[],[],[]],  // penalty cards captured per player
  passDir:'L',             // L/R/X/H
  passSel:[],
  passed:false,
  leadPlayer:-1,           // who leads the current trick
  curPlayer:-1,            // whose turn
  trick:[],                // {seat, card}
  heartsBroken:false,
  firstTrick:true,
  winner:-1,
};

/* ---------- deck / deal ---------- */
function makeDeck(){ const d=[]; for(const s of SUITS) for(let r=1;r<=13;r++) d.push({suit:s,rank:r}); return d; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startHand(){
  deck=shuffle(makeDeck());
  S.hands=[[],[],[],[]];
  deck.forEach((c,i)=>S.hands[i%4].push(c));
  for(let i=0;i<4;i++){ S.captured[i]=[]; S.roundPts[i]=0; }
  renderScoreboard();
  SND.deal();
  nextPassDir();
}
function nextPassDir(){ const seq=['L','R','X','H']; S.passDir=seq[(seq.indexOf(S.passDir)+1)%4]; return S.passDir; }

/* ---------- scoring ---------- */
function roundTotalOf(seat){
  return S.captured[seat].reduce((s,c)=>s+cardPenalty(c),0);
}
function applyRoundScores(){
  for(let i=0;i<4;i++){ const p=roundTotalOf(i); S.scores[i]+=p; S.roundPts[i]=p; }
}
function checkEnd(){
  // game over when someone >=100 (target). Lowest score wins. If multiple >=100, lowest among them.
  if(Math.max(...S.scores)>=100){
    const min=Math.min(...S.scores);
    S.winner=S.scores.indexOf(min);
    S.phase='over';
    showModal(`💀 Game Over<br><span class="text-2xl">${SEAT_NAMES[S.winner]} wins with ${S.scores[S.winner]}!</span>`,'New Game');
    return true;
  }
  return false;
}

/* ---------- passing ---------- */
function startPassing(){
  S.passed=false; S.passSel=[]; S.phase='pass';
  SND.pass();
  if(S.passDir==='L'){ $('pass-msg').textContent='Pass 3 cards to the player on your LEFT.'; }
  else if(S.passDir==='R'){ $('pass-msg').textContent='Pass 3 cards to the player on your RIGHT.'; }
  else if(S.passDir==='X'){ $('pass-msg').textContent='Pass 3 cards ACROSS the table.'; }
  else { $('pass-msg').textContent='No pass this hand (HOLD).'; }
  $('pass-panel').classList.remove('hidden');
  $('pass-btns').innerHTML = S.passDir==='H' ? '' : '<button class="btn btn-cy" onclick="confirmPass()">Pass 3</button>';
  renderMyHand('pass');
}
window.confirmPass=function(){
  if(!S.passDir || S.passDir==='H'){ doNoPass(); return; }
  if(S.passSel.length!==3){ logBad('Select exactly 3 cards to pass.'); return; }
  // Apply a full-rotation pass to all 4 seats at once (each passes 3 to its neighbor).
  // For your seat, use the user's selection; for CPUs, pick their worst-3 penalty cards.
  const dirOff = S.passDir==='L'?1:(S.passDir==='R'?-1:2);
  const selections = [[],[],[],[]];
  // each seat's chosen 3
  selections[0] = S.passSel.map(k=>S.hands[0].find(c=>key(c)===k));
  for(let seat=1; seat<4; seat++){ selections[seat]=chooseCpuPass(seat); }
  // remove chosen from each hand
  for(let seat=0; seat<4; seat++){
    selections[seat].forEach(c=>{ const i=S.hands[seat].findIndex(x=>x===c); if(i>=0) S.hands[seat].splice(i,1); });
  }
  // deliver to target
  for(let seat=0; seat<4; seat++){
    const to=(seat+dirOff+4)%4;
    S.hands[to].push(...selections[seat]);
  }
  sortHand(0);
  log(`You passed ${selections[0].map(c=>rk(c.rank)+SUIT_SYM[c.suit]).join(' ')} → ${SEAT_NAMES[(0+dirOff+4)%4]}.`);
  finishPass();
}
/* CPU pass pick: dump the 3 most dangerous penalty cards (Q♠, 10♦, then high hearts), else lowest non-hearts */
function chooseCpuPass(seat){
  const h=S.hands[seat];
  const score=c=>cardPenalty(c)*10 + (c.suit==='S'&&c.rank===12?50:0) + (c.suit==='D'&&c.rank===10?40:0) + (c.suit==='H'?c.rank:0);
  const sorted=h.slice().sort((a,b)=>score(b)-score(a));
  return sorted.slice(0,3);
}
function doNoPass(){ finishPass(); }
function handsToPassed(){ return S.passSel.map(k=>S.hands[0].find(c=>key(c)===k)); }
function finishPass(){ S.passed=true; $('pass-panel').classList.add('hidden'); beginPlay(); }
function sortHand(i){ S.hands[i].sort((a,b)=>(SUITS.indexOf(a.suit)-SUITS.indexOf(b.suit))||(a.rank-b.rank)); }

/* ---------- play / trick ---------- */
function beginPlay(){
  S.phase='play';
  // find 2♣ holder to lead first trick each round
  const starter = findStartPlayer();
  log(`--- Round ${S.round} — ${SEAT_NAMES[starter]} leads (2♣) ---`);
  S.trick=[]; S.heartsBroken=false; S.firstTrick=true;
  startTrick(starter);
}
function findStartPlayer(){
  for(let i=0;i<4;i++){ const c=S.hands[i].find(c=>c.suit==='C'&&c.rank===2); if(c) return i; }
  return 0;
}
function startTrick(leader){
  S.leadPlayer=leader; S.curPlayer=leader; S.trick=[];
  renderTable();
  if(leader===0){ yourTurn(); }
  else { setTimeout(()=>cpuTurn(), 700); }
}
function yourTurn(){
  renderMyHand('play');
  const lead=S.trick.length?S.trick[0].card:null;
  setMsg(lead?`Follow ${SUIT_SYM[lead.suit]} or play any if void`:'Your lead');
  setHint('Your turn');
  SND.yourTurn();
}
function canPlay(card){
  if(S.phase!=='play') return false;
  if(S.curPlayer!==0) return false;
  if(!S.hands[0].some(c=>key(c)===key(card))) return false;
  const led=S.trick.length?S.trick[0].card:null;
  if(!led) {
    // leading
    if(card.suit==='H' && !S.heartsBroken){
      // allowed to lead hearts only if all remaining cards are hearts
      return S.hands[0].every(c=>c.suit==='H');
    }
    return true;
  }
  // following
  const hasLed=S.hands[0].some(c=>c.suit===led.suit);
  if(hasLed) return card.suit===led.suit;
  // void: no penalty card on first trick
  if(S.firstTrick && isPenalty(card)) return false;
  return true;
}
window.playCard=function(cardKeyStr){
  const k=cardKeyStr;
  const idx=S.hands[0].findIndex(c=>key(c)===k);
  if(idx<0) return;
  const card=S.hands[0][idx];
  if(!canPlay(card)){ logBad('Illegal play'); return; }
  S.hands[0].splice(idx,1);
  playCardForSeat(0,card);
};
function playCardForSeat(seat,card){
  // breaking hearts detection
  if(!S.trick.length && !S.heartsBroken && card.suit==='H') S.heartsBroken=true;
  if(S.trick.length && card.suit==='H') S.heartsBroken=true;
  S.trick.push({seat,card});
  log(`<span class="text-cyan-300">${SEAT_NAMES[seat]}</span> plays ${rk(card.rank)}${SUIT_SYM[card.suit]}`);
  seat===0 ? SND.play() : SND.cpuPlay();
  renderTrickOnTable();
  if(S.trick.length===4){ endTrick(); }
  else {
    S.curPlayer=(S.curPlayer+1)%4;
    if(S.curPlayer===0){ yourTurn(); }
    else setTimeout(()=>cpuTurn(),600);
  }
}
function cpuTurn(){
  if(S.phase!=='play'||S.curPlayer===0) return;
  const seat=S.curPlayer;
  const card=chooseCpuCard(seat);
  S.hands[seat].splice(S.hands[seat].findIndex(c=>key(c)===key(card)),1);
  playCardForSeat(seat,card);
}
/* CPU card choice — follow lead suit if possible; else dump penalty if safe (not first trick), else any */
function chooseCpuCard(seat){
  const hand=S.hands[seat];
  const led=S.trick.length?S.trick[0].card:null;
  if(!led){ // CPU leads
    // don't lead hearts unless forced; prefer low non-heart, avoid 10♦, Q♠
    let candidates=hand.filter(c=>c.suit!=='H' && !(c.suit==='D'&&c.rank===10) && !(c.suit==='S'&&c.rank===12));
    if(!candidates.length) candidates=hand;
    candidates.sort((a,b)=>a.rank-b.rank);
    return candidates[0];
  }
  const follow=hand.filter(c=>c.suit===led.suit);
  if(follow.length){ follow.sort((a,b)=>a.rank-b.rank); return follow[0]; }
  // void: if first trick, can't dump penalty
  const dumpable=hand.filter(c=>!(S.firstTrick&&isPenalty(c)));
  if(dumpable.length){
    // dump highest penalty they hold, else lowest
    const pen=dumpable.filter(isPenalty).sort((a,b)=>cardPenalty(b)-cardPenalty(a));
    if(pen.length) return pen[0];
    const low=dumpable.slice().sort((a,b)=>a.rank-b.rank);
    return low[low.length-1]; // dump highest non-penalty (to shed)
  }
  return hand[0];
}
function endTrick(){
  // winner = highest card of led suit
  const led=S.trick[0].card.suit;
  let winIdx=0, best=S.trick[0].card;
  for(let i=1;i<S.trick.length;i++){
    const c=S.trick[i].card;
    if(c.suit===led && c.rank>best.rank){ best=c; winIdx=i; }
  }
  const winner=S.trick[winIdx].seat;
  const taken=S.trick.filter(t=>isPenalty(t.card)).map(t=>t.card);
  taken.forEach(c=>S.captured[winner].push(c));
  const pts=taken.length?taken.reduce((s,c)=>s+cardPenalty(c),0):0;
  log(`<b>${SEAT_NAMES[winner]}</b> takes the book (${taken.length?('+'+pts+' pts'):'0 pts'}).`);
  if(winner===0){ pts>0 ? SND.penalty() : SND.win(); }
  renderScoreboard();
  S.firstTrick=false;
  if(S.hands[winner].length===0){
    // hand over — check moon BEFORE scoring
    const mooner = S.captured.findIndex(capt => capt.length===15);
    if(mooner>=0){
      S.phase='over'; S.winner=mooner;
      SND.moon();
      showModal(`🌕 <b>${SEAT_NAMES[mooner]} SHOOTS THE MOON!</b> Took all 15 penalty cards — instant win!`,'New Game');
      return;
    }
    applyRoundScores();
    renderScoreboard();
    log('--- Hand complete ---');
    if(checkEnd()) return;
    S.round++;
    startHand();
    startPassing();
    return;
  }
  startTrick(winner);
}

/* ===== AUDIO (Web Audio API — same sound set as Lo-Lifes Spades) ===== */
let AC=null, soundOn=true, audioMaster=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); audioMaster=AC.createGain(); audioMaster.gain.value=0.35; audioMaster.connect(AC.destination);}catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function tone(freq,dur,type,vol,delay){
  const ctx=ac(); if(!ctx||!soundOn) return;
  const t=(ctx.currentTime)+(delay||0);
  const o=ctx.createOscillator(); o.type=type||'square';
  o.frequency.setValueAtTime(freq,t);
  const g=ctx.createGain();
  g.gain.setValueAtTime(vol||0.3,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(audioMaster||ctx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function glassNoise(){
  const ctx=ac(); if(!ctx||!soundOn) return;
  const t=ctx.currentTime, dur=0.35;
  const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++){ d[i]=(Math.random()*2-1)*(1-i/len); }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1600;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(hp); hp.connect(g); g.connect(audioMaster||ctx.destination);
  src.start(t); src.stop(t+dur+0.02);
  tone(180,0.12,'sine',0.2,0);
}
const SND={
  deal:      ()=>{ for(let i=0;i<6;i++) tone(220+ i*45,0.07,'triangle',0.2,i*0.035); },
  play:      ()=>{ tone(520,0.09,'square',0.28); tone(700,0.06,'triangle',0.15,0.02); },
  yourTurn:  ()=>{ tone(880,0.12,'square',0.35); tone(1170,0.18,'square',0.3,0.12); },
  cpuPlay:   ()=>{ tone(400,0.07,'triangle',0.18); },
  win:       ()=>{ tone(660,0.10,'sine',0.3); tone(880,0.10,'sine',0.3,0.08); tone(1100,0.16,'sine',0.3,0.16); },
  lose:      ()=>{ tone(300,0.14,'sawtooth',0.2); tone(220,0.18,'sawtooth',0.2,0.1); },
  moon:      ()=>{ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.18,'sine',0.3,i*0.09)); },
  penalty:   ()=>{ tone(150,0.2,'sawtooth',0.25,0); tone(120,0.25,'sawtooth',0.2,0.1); },
  pass:      ()=>{ tone(500,0.08,'triangle',0.2,0); tone(650,0.08,'triangle',0.2,0.06); },
};
window.toggleSound=function(){ soundOn=!soundOn; if(soundOn) SND.pass(); return soundOn; };
function unlockAudio(){ ac(); window.removeEventListener('click',unlockAudio); window.removeEventListener('keydown',unlockAudio); }
window.addEventListener('click', unlockAudio);
window.addEventListener('keydown', unlockAudio);

/* ---------- render ---------- */
function cardEl(c,{back=false,sel=false,dim=false}={}){
  const d=document.createElement('div');
  if(back){ d.className='card-back-img'; return d; }
  d.className='card-face'+(RED[c.suit]?' red':'')+(sel?' sel':'')+(dim?'': '');
  d.textContent=rk(c.rank)+SUIT_SYM[c.suit];
  return d;
}
function renderMyHand(mode){
  const el=$('my-hand'); el.innerHTML='';
  sortHand(0);
  S.hands[0].forEach(c=>{
    const e=cardEl(c);
    if(mode==='pass'||mode==='play'){
      e.onclick=()=>{
        if(mode==='pass'){
          const k=key(c);
          if(S.passSel.includes(k)) S.passSel=S.passSel.filter(x=>x!==k);
          else if(S.passSel.length<3) S.passSel.push(k);
          renderMyHand('pass');
        } else if(mode==='play'){
          playCard(key(c));
        }
      };
      if(mode==='pass' && S.passSel.includes(key(c))) e.classList.add('sel');
    }
    el.appendChild(e);
  });
}
function renderOpponents(){
  const seats=[1,2,3]; const pos = {1:{el:'seat-east',label:'EAST'},2:{el:'seat-north',label:'NORTH'},3:{el:'seat-west',label:'WEST'}};
  seats.forEach(seat=>{
    const host=$(pos[seat].el); host.innerHTML='';
    const lbl=document.createElement('div'); lbl.className='text-center text-[11px] font-bold text-emerald-200 mb-0.5'; lbl.textContent=pos[seat].label+' ('+S.hands[seat].length+')';
    const row=document.createElement('div');
    const isSide=(seat===1||seat===3); // East/West vertical, like Spades
    // Spades technique: North horizontal fan (-space-x), West/East vertical (-space-y)
    row.className = isSide ? 'flex flex-col justify-center' : 'flex';
    row.style.alignItems='center';
    if(isSide){ row.style.flexDirection='column'; } // vertical for East/West
    const n=Math.min(8, S.hands[seat].length); // compact pile, cap visible backs
    for(let i=0;i<n;i++){ row.appendChild(cardEl(null,{back:true})); }
    host.appendChild(lbl); host.appendChild(row);
  });
}
function renderTrickOnTable(){
  const ta=$('trick-area'); ta.innerHTML='';
  // Cluster the played cards in the CENTER of the table (clear of the edge hands).
  // North/South offset vertically, West/East horizontally — all near the middle.
  S.trick.forEach(t=>{
    const e=cardEl(t.card); e.classList.add('trick-card');
    if(t.seat===2){ e.style.left='50%'; e.style.top='42%'; e.style.transform='translate(-50%,-50%)'; }
    else if(t.seat===3){ e.style.left='42%'; e.style.top='58%'; e.style.transform='translate(-50%,-50%)'; }
    else if(t.seat===1){ e.style.left='58%'; e.style.top='58%'; e.style.transform='translate(-50%,-50%)'; }
    else if(t.seat===0){ e.style.left='50%'; e.style.top='50%'; e.style.transform='translate(-50%,-50%)'; }
    ta.appendChild(e);
  });
  renderOpponents();
}
function renderTable(){
  renderOpponents();
  renderTrickOnTable();
  renderScoreboard();
  setMsg(S.phase==='over'?'':'');
}
function renderScoreboard(){
  // Update the header score chips + badges (Spades-style top scoreboard).
  const ids={0:'score-you',1:'score-east',2:'score-north',3:'score-west'};
  for(let i=0;i<4;i++){ const el=$(ids[i]); if(el) el.textContent=S.scores[i]; }
  const rb=$('round-badge'); if(rb) rb.textContent='Round '+S.round;
  const hs=$('hearts-status'); if(hs) hs.textContent = S.heartsBroken ? '♥ Hearts broken' : '♥ Hearts sealed';
  const pb=$('phase-badge'); if(pb){
    if(S.phase==='pass') pb.textContent='Passing phase';
    else if(S.phase==='over') pb.textContent='Game over';
    else if(S.phase==='play') pb.textContent='Play — '+(S.curPlayer!=null?SEAT_NAMES[S.curPlayer]+"'s turn":"starting…");
    else pb.textContent='Starting…';
  }
}
function setMsg(t){ $('turn-msg').textContent=t; }
function setHint(t){ $('turn-hint').textContent=t; }
function log(msg){ const el=$('log'); const d=document.createElement('div'); d.innerHTML=msg; el.prepend(d); while(el.children.length>100) el.lastChild.remove(); }
function logBad(m){ log('<span class="text-red-400">'+m+'</span>'); }
window.clearLog=function(){ const el=document.getElementById('log'); if(el) el.innerHTML=''; };
window.toggleLogWindow=function(){ const w=document.getElementById('log-window'); if(w) w.classList.toggle('hidden'); };
(function initLogDrag(){
  const win=document.getElementById('log-window'); if(!win) return;
  let dragging=false, offX=0, offY=0;
  win.addEventListener('mousedown',function(e){ if(e.target.closest('button')) return; dragging=true; offX=e.clientX-win.getBoundingClientRect().left; offY=e.clientY-win.getBoundingClientRect().top; });
  window.addEventListener('mousemove',function(e){ if(!dragging) return; const x=Math.min(window.innerWidth-30,Math.max(0,e.clientX-offX)); const y=Math.min(window.innerHeight-30,Math.max(0,e.clientY-offY)); win.style.left=x+'px'; win.style.top=y+'px'; win.style.right='auto'; win.style.bottom='auto'; });
  window.addEventListener('mouseup',function(){ dragging=false; });
})();
function showModal(html,btn){
  $('modal-box').innerHTML='<div class="text-2xl mb-3">'+html.split('<br>')[0]+'</div><div class="mb-4">'+html+'</div><button class="btn btn-em" onclick="closeModal()">'+btn+'</button>';
  $('modal').classList.remove('hidden');
}
window.closeModal=function(){ $('modal').classList.add('hidden'); resetGame(); };

/* ---------- boot ---------- */
window.resetGame=function(){
  try{ if(typeof LoLifeWorldCounter!=='undefined')LoLifeWorldCounter.record('dirty_hearts'); }catch(e){}
  try{ if(typeof LoLifeGames!=='undefined')LoLifeGames.countPlay('dirty_hearts'); }catch(e){}
  S.scores=[0,0,0,0]; S.round=1; S.passDir='L'; S.winner=-1; S.phase='idle';
  startHand();
  log('--- NEW GAME: Lo-Lifes Hearts (to 100, lowest wins) ---');
  startPassing();
};
window.addEventListener('DOMContentLoaded',()=>{ resetGame(); });
</script>
